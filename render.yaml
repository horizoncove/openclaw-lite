# Render Blueprint — 一键部署西安微短剧 SaaS
# 使用方式：https://render.com/deploy?repo=https://github.com/horizoncove/openclaw-lite

services:
  - type: web
    name: xian-drama-saas
    runtime: docker
    rootDir: xian-drama-saas
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: xian-drama-db
          property: connectionString

databases:
  - name: xian-drama-db
    plan: basic-256mb
    region: singapore
    databaseName: xian_drama
    user: xian_drama

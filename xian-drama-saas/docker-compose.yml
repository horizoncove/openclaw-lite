services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xian_drama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xian_drama_pass}
      POSTGRES_DB: ${POSTGRES_DB:-xian_drama}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xian_drama} -d ${POSTGRES_DB:-xian_drama}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-xian_drama}:${POSTGRES_PASSWORD:-xian_drama_pass}@db:5432/${POSTGRES_DB:-xian_drama}
      STORAGE: postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
